[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-sprint-06"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # SDK replaces direct anthropic calls in agent.py (RULE-SDK01)
    # ponytail: verify exact package name in Phase 4 -- SDK is still early-stage
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.3.1",
    # mem0ai removed -- Sprint 5 benchmark showed 1,035ms overhead without a real KB
    # anthropic removed -- SDK manages the subprocess; direct calls gone from Sprint 6
    "hatchling",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
