[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-sprint-06d"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Google ADK -- LlmAgent, Workflow graph engine, Runner, callbacks (RULE-ADK01/02/03).
    # >=2.0 pins to the release line that ships Workflow (SequentialAgent/ParallelAgent's
    # deprecated successor, google.adk.Workflow) -- this floor is deliberate, not incidental.
    "google-adk>=2.0.0",
    "google-genai>=1.0.0",
    # Judge stays on the Anthropic gateway for cross-lab eval comparability (eval/judge.py)
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.3.1",
    "hatchling",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
