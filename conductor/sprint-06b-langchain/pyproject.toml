[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-sprint-06b"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # create_agent() harness (RULE-LC01) -- replaces LangGraph CompiledGraph
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.3.1",
    "hatchling",
    # InMemorySaver replaces langgraph-checkpoint-sqlite (sufficient for sprint-6b comparison)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
